name: Kickstarter Research Scheduled Run

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  run-research:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pipeline
        run: python main.py --config config.yaml

      - name: Upload Excel Output
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: research-report
          path: output/kickstarter_research_report.xlsx

      - name: Upload Logs
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: execution-logs
          path: output/logs/

      - name: Upload Errors
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: error-logs
          path: output/errors/
